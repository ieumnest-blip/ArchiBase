<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건축물대장 일괄조회</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1d2129;--muted:#6b7280;--line:#e3e6eb;
  --accent:#2457d6;--accent-soft:#e8eefc;--warn:#b45309;--warn-soft:#fff7e6;--err:#c62828;--err-soft:#fdecec;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14161a;--card:#1d2026;--text:#e7e9ee;--muted:#9aa1ad;--line:#2e333b;
  --accent:#6f9bff;--accent-soft:#1f2b46;--warn:#f0b35a;--warn-soft:#3a2d17;--err:#ff7b7b;--err-soft:#3a1d1d;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1680px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
#q{flex:1;min-width:220px;font-size:15px}
button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:9px 16px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
details summary{cursor:pointer;font-weight:600}
.keys{display:grid;grid-template-columns:160px 1fr;gap:8px 10px;margin-top:12px;align-items:center}
.keys input,.keys select{width:100%}
.hint{color:var(--muted);font-size:12.5px}
.hint a{color:var(--accent)}
.msg{padding:10px 12px;border-radius:7px;margin-top:10px}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.cands{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cand{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.cand:last-child{border-bottom:0}
.cand:hover{background:var(--accent-soft)}
.cand b{display:block}
.cand span{color:var(--muted);font-size:12.5px}
.target{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.target h2{margin:0;font-size:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--card);color:var(--text);cursor:pointer;font-weight:500}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip .n{color:var(--muted);margin-left:4px}
section.reg h3{font-size:15px;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--text)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin:0 0 14px}
.kv div{display:flex;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv dt{width:42%;background:var(--bg);padding:6px 8px;color:var(--muted);font-size:12.5px}
.kv dd{margin:0;padding:6px 8px;flex:1;word-break:break-all}
.bldtitle{font-weight:700;margin:12px 0 6px}
.kv div.hl dt{color:#d32f2f;font-weight:700}
.kv div.hl dt i{font-style:normal;color:#d32f2f;margin-right:4px}
.kv div.hl dd{font-weight:700;outline:2px solid #e53935;outline-offset:-3px;text-decoration:underline;text-decoration-color:#e53935;text-decoration-thickness:2px;text-underline-offset:3px}
.owner .row{margin-top:10px}
.owner a{text-decoration:none}
@media print{.kv div.hl dd{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{background:var(--bg);color:var(--muted);font-weight:600;position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:6px 0}
.filter{margin-bottom:10px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.printhead{display:none}
/* 좌우 넘김 슬라이드 */
.sumline{line-height:1.9;font-size:14.5px;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px}
.sumline .sep{color:var(--muted);margin:0 10px}
.sumtbl th.hl{color:#d32f2f;font-weight:700}
.sumtbl td.hl{font-weight:700;color:var(--text);box-shadow:inset 0 0 0 2px #e53935;text-decoration:underline;text-decoration-color:#e53935;text-decoration-thickness:2px;text-underline-offset:3px}
@media print{.sumtbl td.hl{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.chip.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.cur .n{color:rgba(255,255,255,.8)}
.pager{position:sticky;top:0;z-index:5;display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0}
.pager .arrow{flex:0 0 36px;padding:0;background:transparent;border:0;color:var(--muted);font-size:20px;font-weight:400;border-radius:0}
.pager .arrow:disabled{opacity:.3}
.tabs{flex:1;display:flex;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--muted);font-weight:600;padding:12px 14px 9px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.cur{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{display:inline-block;margin-left:5px;padding:0 6px;border-radius:999px;background:var(--bg);color:var(--muted);font-size:11.5px;font-weight:600;line-height:18px}
.tab.cur .n{background:var(--accent-soft);color:var(--accent)}
.issue{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.issue .vsep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.issue .copy{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.issue .copy.done{background:#e7f6ec;color:#1b7f3b;border-color:#1b7f3b}
.issuehelp{margin-top:10px;font-size:12.5px;color:var(--muted)}
.issuehelp summary{font-weight:500;color:var(--muted)}
.issuehelp ul{margin:6px 0 0;padding-left:18px}
.issuehelp li{margin:3px 0}
#map{height:min(720px,78vh);border-radius:8px;border:1px solid var(--line);margin:10px 0 8px;background:var(--bg);z-index:0}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;transition:grid-template-columns .2s}
.mapgrid.wide{grid-template-columns:minmax(0,1fr) 560px}
.mapgrid.noside{grid-template-columns:minmax(0,1fr) 0}
.mapgrid.noside .side{display:none}
.mapgrid #map{margin:0}
.side{height:min(720px,78vh);overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.sidebox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card)}
#ovBox.sidebox{border:2px solid #e91e63}
.sideh{font-weight:700;font-size:15px;margin-bottom:6px}
.sideh .hint{font-weight:400;margin-left:4px}
.shgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:10px 0 8px}
.shgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.shgrid input,.shgrid select{width:100%;padding:6px 8px;font-size:13.5px;color:var(--text)}
.shgrid .row input{width:56px}
.sidehelp{margin-top:8px;font-size:12.5px;color:var(--muted)}
.sidehelp summary{cursor:pointer;font-weight:600}
.sidehelp p{margin:6px 0 0;line-height:1.7}
.side .shbig{font-size:13px;line-height:1.6;padding:7px 10px}
.side .shbig b{font-size:14.5px}
button.xs{padding:1px 8px;font-size:11.5px;border-radius:5px;margin-left:4px;vertical-align:1px;background:#fff;color:#b71c1c;border:1px solid #e57373}
.shcol{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:2px 0 6px}
.shcol input{width:28px;height:22px;padding:0;border:1px solid var(--line);border-radius:4px}
.side .shtime{padding:6px 10px}
@media (max-width:900px){.mapgrid,.mapgrid.wide{grid-template-columns:1fr}.side{height:auto;overflow:visible}}
.maptop{padding:10px 12px;background:var(--warn-soft);border-radius:8px}
.maptop .hint{color:var(--text)}
.tmplist{margin:4px 0 0;padding-left:18px}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:15.5px;font-weight:600;color:var(--text);margin:2px 0 8px}
.legend i{display:inline-block;width:22px;height:14px;border:2.5px solid;margin-right:7px;vertical-align:-2px}
.mapnote{font-size:14px;color:var(--muted);line-height:1.6}
.mapnote b{color:var(--text)}
.leaflet-container{font:inherit}
.leaflet-tooltip.bldlabel{background:rgba(255,255,255,.88);color:#123;border:1px solid #2f7bff;border-radius:4px;box-shadow:none;padding:1px 5px;font-size:11px;font-weight:700;white-space:nowrap}
.leaflet-tooltip.bldlabel::before{display:none}
.leaflet-tooltip.bldlabel.nolink{background:#ff9800;color:#fff;border-color:#e65100;font-size:12px}
@media (max-width:600px){#map{height:460px}}
/* 거리 재기 */
.mctl a{font-size:15px;line-height:30px;width:30px;height:30px;text-align:center;text-decoration:none;cursor:pointer}
.mctl a.active{background:#ff1f6b;color:#fff}
.measuring, .measuring .leaflet-interactive{cursor:crosshair!important}
.leaflet-marker-icon.mvtx{background:none;border:0}
.leaflet-tooltip.mlabel{background:#fff;color:#ff1f6b;border:2px solid #ff1f6b;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.25);padding:1px 6px;font-size:13px;font-weight:800;white-space:nowrap}
.leaflet-tooltip.mlabel::before{display:none}
.leaflet-tooltip.mlabel.mtotal{background:#ff1f6b;color:#fff}
.leaflet-tooltip.mlabel.marea{background:#ffd400;color:#000;border-color:#e6a800;font-size:14px}
.areabox{position:absolute;left:10px;bottom:24px;z-index:800;display:none;background:rgba(255,255,255,.95);color:#123;border:2px solid #e6a800;border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.6;max-width:300px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.areabox .hint{font-size:11.5px}
.mhint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:800;background:rgba(0,0,0,.72);color:#fff;font-size:12.5px;padding:5px 10px;border-radius:6px;pointer-events:none;white-space:nowrap;display:none}
.measuring .mhint{display:block}
/* 음영확인 */
.shctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:4px 0 8px}
.shctl label{display:flex;align-items:center;gap:6px;font-size:13px}
.shctl input[type=number]{width:70px;padding:6px 8px}
.shctl input[type=date],.shctl select{padding:6px 8px}
.shtime{display:flex;align-items:center;gap:12px;margin:6px 0;padding:8px 12px;background:var(--bg);border-radius:8px}
.shtime b{min-width:52px;font-size:16px}
.shtime input[type=range]{flex:1;padding:0}
#map.dim .leaflet-tile-pane{opacity:.45}
.mapbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 12px;margin:6px 0 0;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;font-size:13.5px}
.mapbar .mbt{font-weight:700;color:var(--muted)}
.mapbar label{display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.mapbar input:disabled+i,.mapbar label:has(input:disabled){opacity:.5;cursor:default}
.mapbar .sw{display:inline-block;width:18px;height:12px;border:2.5px solid;border-radius:2px}
.mapbar .vsep{width:1px;height:20px;background:var(--line)}
.mapbar+.mapgrid{margin-top:8px}
.cadicon{background:none;border:0}
.shroofs summary{color:var(--text)}
.shset{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.shset>summary{cursor:pointer;font-weight:700;font-size:13.5px}
#shSet{margin-top:4px;background:var(--bg)}
#shSetBtn.on{background:var(--accent);color:#fff}
.shset>summary .hint{font-weight:400;margin-left:4px}
.shset .shgrid{margin-top:10px}
.shroof{display:grid;grid-template-columns:1fr auto 46px auto;gap:5px;align-items:center;padding:6px 8px;border-bottom:1px dashed var(--line);font-size:12.5px;color:var(--text);min-width:0}
.shroof>*{min-width:0}
.shroof.chk{background:#fff7ed}
.shroof.hot{background:#cff8ff!important;outline:2px solid #00b8d4}
.rno{width:22px;height:22px;border-radius:50%;background:rgba(17,24,39,.78);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer}
.rno.hot{background:#00b8d4;transform:scale(1.25)}
.rno.sm{display:inline-flex;width:19px;height:19px;font-size:10.5px;vertical-align:-4px;cursor:default}
.shroof input{padding:4px 3px;font-size:13px;width:34px;text-align:center}
.shroof input::-webkit-inner-spin-button{display:none}
.shroof .shh{cursor:text;border-bottom:1px dashed var(--muted)}
.shroof .shhin{width:46px!important}
.relink{margin-top:4px;font-size:11.5px;color:var(--muted)}
.relink select{font-size:11.5px;padding:1px 3px;max-width:150px}
.leaflet-popup .relink{margin-top:6px;padding-top:6px;border-top:1px dashed #ddd;font-size:12px}
.shroof .shh{font-size:12.5px;text-align:right}
.shpop input{width:58px}
.tagm{background:rgba(255,255,255,.94);border:1px solid #2f7bff;color:#123;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:move;text-align:center;line-height:18px}
.cadicon .cad{cursor:move}
.ckrow{display:grid;grid-template-columns:34px 1fr auto auto;gap:5px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.ckrow input[type=color]{width:34px;height:30px;padding:1px;border-radius:5px}
.ckrow input[type=text]{padding:6px 8px;font-size:13px}
.ckrow .ckfrom{grid-column:2 / -1;font-size:11.5px;margin-top:-2px}
#ckDraw.on{background:#facc15;border-color:#ca8a04;color:#000}
.cad{display:block;height:100%;box-sizing:border-box;padding:1px 6px 0;border-bottom:2px solid var(--l,var(--c));color:var(--c);font-size:13.5px;font-weight:800;line-height:18px;white-space:nowrap;text-align:center;
  text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 3px #fff}
.leaflet-tooltip.tag{background:#fff;color:#1d2129;border:1px solid #9aa1ad;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.3);padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.leaflet-tooltip.tag::before{display:none}
.leaflet-tooltip.tag.name{border-color:#5b8def;color:#1a3f8f}
.leaflet-tooltip.tag.nolink{background:#fff8eb;border-color:#f59e0b;color:#92400e}
.leaflet-tooltip.tag.nodraw{background:#fdecea;border-color:#e53935;color:#b71c1c}
.leaflet-tooltip.tag.shng{background:#fff;border-color:#e53935;color:#c62828}
.leaflet-tooltip.tag.name{background:rgba(255,255,255,.92);border:1px solid #2f7bff;color:#123;font-size:11.5px;padding:1px 6px}
.shhow{font-size:13px;line-height:1.8;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;margin:4px 0 8px}
.shbig{font-size:16px;line-height:1.7;padding:12px 14px;border-radius:8px;margin:6px 0 0}
.shbig.ok{background:#e7f6ec;color:#1b5e20}.shbig.ng{background:#fdecec;color:#b71c1c}
.shbig b{font-size:20px}
.shtbl{margin:8px 0 4px}.shtbl summary{font-weight:600}
.leaflet-tooltip.shlab{border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.35);padding:2px 7px;font-size:13px;font-weight:800;white-space:nowrap}
.leaflet-tooltip.shlab::before{display:none}
.leaflet-tooltip.shlab.ok,.shlab-s.ok{background:#2e7d32;color:#fff;border:1px solid #1b5e20}
.leaflet-tooltip.shlab.ng,.shlab-s.ng{background:#d32f2f;color:#fff;border:1px solid #8e0000}
.shlab-s{display:inline-block;border-radius:4px;padding:0 6px;font-size:12px;font-weight:700}
#shmap{height:min(640px,72vh);border-radius:8px;border:1px solid var(--line);margin:8px 0;background:var(--bg);z-index:0}
.shleg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);flex-wrap:wrap;margin-bottom:6px}
.shleg .bar{display:inline-block;width:160px;height:12px;border-radius:3px}
.shres{padding:10px 12px;background:var(--bg);border-radius:8px;line-height:1.9;font-size:14.5px;margin-top:8px}
.shres b.big{font-size:18px;color:#d32f2f}
.shpop input{width:70px;padding:4px 6px}
.shpop button{padding:4px 10px;margin-left:4px}
@media (max-width:600px){#shmap{height:440px}}
.shsec{margin-top:22px;padding-top:14px;border-top:2px solid var(--text)}
.shsech{font-size:16px;font-weight:700;margin-bottom:8px}
/* 현황도 겹쳐보기 */
.ovbox{margin-top:12px;padding:12px 14px;border:2px solid #e91e63;border-radius:10px;background:var(--card)}
.ovbox .filebtn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:600}
.ovstep{font-size:13.5px;line-height:1.6}
.ovcv{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.ovcv canvas{display:block;cursor:crosshair}
.ovcv.panning canvas{cursor:grab}.ovcv.grabbing canvas{cursor:grabbing}
.mflash{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:1000;background:rgba(229,57,53,.95);color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:16px;pointer-events:none}
button.sm{padding:5px 11px;font-size:13px}
#ovMarkBtn.on{background:#ffd600;border-color:#c7a500;color:#000}
.ovlab{display:flex;align-items:center;gap:6px;font-size:13px}
.ovnum{width:30px;height:30px;border-radius:50%;background:#ffd600;color:#000;border:2px solid #000;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.ovnum.sm{width:24px;height:24px;font-size:13px;flex:0 0 auto}
.ovlist{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.ovlist .ovmemo{flex:1;min-width:200px;padding:6px 9px}
.leaflet-tooltip.bldlabel.nolink.nodraw{background:#d32f2f;border-color:#8e0000}
/* ---- 한 화면 배치 ---- */
.wrap{padding-top:10px!important;padding-bottom:20px!important}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.topbar h1{font-size:19px;margin:0;white-space:nowrap}
.topsearch{display:flex;gap:6px;flex:1;min-width:280px;max-width:640px}
.topsearch #q{flex:1;min-width:0;padding:7px 10px;font-size:14px}
.topsearch button{padding:7px 14px}
#keyBtn{margin-left:auto}
.modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding-top:70px}
.modal[hidden]{display:none}
.modalbox{background:var(--card);border-radius:10px;padding:16px 18px;width:min(760px,94vw);box-shadow:0 8px 30px rgba(0,0,0,.3)}
#cands .cands{position:relative;z-index:30}
.tcard{padding:10px 14px;margin-bottom:8px}
.tcard .target h2{font-size:16px}
.tcard .issue{margin:0;padding:0;border:0}
details.issuehelp{position:relative;margin:0}
details.issuehelp summary{list-style:none;border:1px solid var(--accent);color:var(--accent);border-radius:7px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
details.issuehelp summary::-webkit-details-marker{display:none}

/* ? 아이콘에 마우스를 올리면(또는 누르면) 나오는 메모카드 — 여러 쪽이면 ◀ ▶ 로 넘겨 봄 */
(()=>{
  let el = null, pages = [], p = 0, anchor = null, timer = null, sticky = false;
  const card = ()=>{ if (!el){ el = document.createElement("div"); el.id = "memoCard"; el.className = "memo noprint"; el.hidden = true; document.body.appendChild(el); } return el; };
  const place = ()=>{
    if (!anchor) return;
    const c = card(), r = anchor.getBoundingClientRect(), w = c.offsetWidth, h = c.offsetHeight;
    let x = Math.max(8, Math.min(r.left - 18, innerWidth - w - 8)), y = r.bottom + 6;
    if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 6);
    c.style.left = x + "px"; c.style.top = y + "px";
  };
  const render = ()=>{
    card().innerHTML = `<div>${esc(pages[p])}</div>` + (pages.length > 1 ? `<div class="mp"><button type="button" data-mp="-1">◀</button><span>${p + 1} / ${pages.length}</span><button type="button" data-mp="1">▶</button></div>` : "");
    place();
  };
  const open = q=>{
    if (anchor !== q || card().hidden){ try { pages = JSON.parse(q.dataset.memo); } catch(e){ return; } p = 0; if (anchor) anchor.classList.remove("on"); anchor = q; q.classList.add("on"); card().hidden = false; render(); }
  };
  const close = ()=>{ sticky = false; if (anchor) anchor.classList.remove("on"); anchor = null; if (el) el.hidden = true; };
  document.addEventListener("mouseover", e=>{
    const q = e.target.closest?.(".qm");
    if (q){ clearTimeout(timer); open(q); } else if (e.target.closest?.("#memoCard")) clearTimeout(timer);
  });
  document.addEventListener("mouseout", e=>{
    if (sticky) return;
    if (e.target.closest?.(".qm") || e.target.closest?.("#memoCard")){ clearTimeout(timer); timer = setTimeout(close, 260); }
  });
  document.addEventListener("click", e=>{
    const b = e.target.closest?.("[data-mp]");
    if (b){ p = (p + +b.dataset.mp + pages.length) % pages.length; render(); return; }
    const q = e.target.closest?.(".qm");
    if (q){ if (sticky && anchor === q){ close(); } else { open(q); sticky = true; } return; }
    if (!e.target.closest?.("#memoCard")) close();
  });
  window.addEventListener("scroll", ()=>{ if (anchor) close(); }, true);
})();

/* ---------- 공통 ---------- */
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function msg(html, cls="err"){ $("#msg").innerHTML = html ? `<div class="msg ${cls}">${html}</div>` : ""; }
function fmt(k, v){
  if (v === null || v === undefined) return "";
  v = String(v).trim();
  if (/Day$/.test(k) && /^\d{8}$/.test(v)) return `${v.slice(0,4)}.${v.slice(4,6)}.${v.slice(6)}`;
  if (NUMS.test(k) && v !== "" && !isNaN(v)) return Number(v).toLocaleString("ko-KR", {maximumFractionDigits:4});
  return v;
}
function viaProxy(url){
  const p = $("#proxy").value.trim();
  if (!p) return url;
  return p.endsWith("=") ? p + encodeURIComponent(url) : p + url;
}
function jsonp(url){
  return new Promise((res, rej)=>{
    const cb = "__juso" + Date.now() + Math.floor(Math.random()*1e4);
    const s = document.createElement("script");
    const t = setTimeout(()=>{ cleanup(); rej(new Error("API 응답 시간 초과")); }, 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    s.onerror = () => { cleanup(); rej(new Error("API 호출 실패")); };
    s.referrerPolicy = "no-referrer"; // 브이월드는 포트 포함 Referer를 거부 → Referer 없이 호출
    s.src = url + "&callback=" + cb;
    document.head.appendChild(s);
  });
}

/* 도로명주소 API 호출 (관련지번 포함: addInfoYn=Y) */
async function jusoApi(kw, n){
  const key = $("#jusoKey").value.trim();
  const qs = `confmKey=${encodeURIComponent(key)}&currentPage=1&countPerPage=${n}&keyword=${encodeURIComponent(kw)}&resultType=json&addInfoYn=Y`;
  let data;
  try{
    const r = await fetch("https://business.juso.go.kr/addrlink/addrLinkApi.do?" + qs);
    data = await r.json();
  }catch(err){
    data = await jsonp("https://business.juso.go.kr/addrlink/addrLinkApiJsonp.do?" + qs);
  }
  if (typeof data === "string") data = JSON.parse(data);
  return data;
}

/* ---------- 2. 건축물대장 조회 ---------- */
let result = null;
const lotLabel = q=>`${q.dong ? q.dong + " " : ""}${q.platGbCd === "1" ? "산" : ""}${+q.bun}${+q.ji ? "-" + (+q.ji) : ""}`;
const lotPnu = q=>q.sigunguCd + q.bjdongCd + (q.platGbCd === "1" ? "2" : "1") + q.bun + q.ji;
/* 관련지번 한 개("장동 306-57", "산 12-3" 등)를 조회용 값으로 바꿈. 동 이름이 다르면 주소 검색으로 법정동코드를 찾음 */
async function resolveLot(j, txt){
  const m = String(txt).trim().match(/^(.*?)\s*(산)?\s*(\d+)(?:-(\d+))?$/);
  if (!m) return null;
  const dong = m[1].trim(), here = j.liNm || j.emdNm;
  let adm = j.admCd;
  if (dong && dong !== here && dong !== j.emdNm && !dong.endsWith(here)){
    try{
      const d = await jusoApi(`${j.siNm} ${j.sggNm} ${txt}`, 5);
      const hit = (d.results?.juso || []).find(x=>(x.liNm || x.emdNm) === dong || x.emdNm === dong || String(x.jibunAddr).includes(dong));
      if (!hit) return null;
      adm = hit.admCd;
    }catch(e){ return null; }
  }
  return {sigunguCd: adm.slice(0,5), bjdongCd: adm.slice(5,10), platGbCd: m[2] ? "1" : "0",
    bun: m[3].padStart(4,"0"), ji: String(m[4] || 0).padStart(4,"0"), dong: dong || here};
}
async function pick(i){
  const j = lastJuso[i];
  $("#cands").innerHTML = "";
  const p = {
    sigunguCd: j.admCd.slice(0,5), bjdongCd: j.admCd.slice(5,10),

    bun: String(j.lnbrMnnm).padStart(4,"0"), ji: String(j.lnbrSlno || 0).padStart(4,"0"), dong: j.liNm || j.emdNm
  };
  // 도로명 하나에 지번이 여러 개 묶여 있으면(관련지번) 모두 조회
  const lots = [p];
  const rel = String(j.relJibun || "").split(",").map(x=>x.trim()).filter(Boolean);
  if (rel.length) msg(`<span class="spinner"></span>관련지번 ${rel.length}개 확인 중…`, "warn");
  for (const r of rel){
    const q = await resolveLot(j, r);
    if (q && !lots.some(x=>lotPnu(x) === lotPnu(q))) lots.push(q);
  }
  msg("");
  lots.forEach(q=>q.label = lotLabel(q));
  fetchAll(j, p, lots);
}

async function callApi(op, p, pageNo, svcOverride){
  const svc = svcOverride || $("#svc").value;
  const key = $("#dataKey").value.trim();
  // Encoding 키(이미 %xx 포함)면 그대로, Decoding 키면 인코딩
  const k = /%[0-9A-Fa-f]{2}/.test(key) ? key : encodeURIComponent(key);
  const url = `https://apis.data.go.kr/1613000/${svc}/${op}?serviceKey=${k}` +
    `&sigunguCd=${p.sigunguCd}&bjdongCd=${p.bjdongCd}&platGbCd=${p.platGbCd}&bun=${p.bun}&ji=${p.ji}` +
    `&numOfRows=${PAGE}&pageNo=${pageNo}&_type=json`;
  // 공공데이터포털은 가끔 JSON 대신 오류 페이지를 돌려주므로 최대 3번까지 재시도
  let d, lastErr;
  for (let attempt = 1; attempt <= 3; attempt++){
    if (attempt > 1) await new Promise(res=>setTimeout(res, 500 * attempt));
    try{
      const r = await fetch(viaProxy(url));
      const text = await r.text();
      if (r.status === 403) throw Object.assign(new Error(`이 인증키로 활용신청되지 않은 서비스입니다 (${svc}). 공공데이터포털에서 활용신청 후 1~2시간 뒤 다시 시도하세요.`), {fatal:true});
      try { d = JSON.parse(text); }
      catch(e){
        const m = text.match(/<returnAuthMsg>([^<]+)|<resultMsg>([^<]+)|<errMsg>([^<]+)/);
        const why = m ? (m[1]||m[2]||m[3]) : `응답 해석 실패 (HTTP ${r.status}: ${text.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,60) || "빈 응답"})`;
        throw Object.assign(new Error(why), {fatal: /SERVICE_KEY|SERVICE KEY|등록되지 않은/i.test(why)});
      }
      const h = d.response?.header;
      if (h && h.resultCode !== "00") throw Object.assign(new Error(`${h.resultCode} ${h.resultMsg}`), {fatal: /^(20|30|31|32|33)$/.test(h.resultCode)});
      lastErr = null; break;
    }catch(err){
      lastErr = err; d = null;
      if (err.fatal) break;
    }
  }
  if (lastErr) throw lastErr;
  const b = d.response?.body || {};
  let items = b.items?.item || [];
  if (!Array.isArray(items)) items = [items];
  return { items, total: Number(b.totalCount || 0) };
}

async function fetchOne(op, p, svc){
  const first = await callApi(op, p, 1, svc);
  let items = first.items;
  const pages = Math.min(Math.ceil(first.total / PAGE), MAX_PAGES);
  for (let pg = 2; pg <= pages; pg += 5){
    const batch = [];
    for (let k = pg; k < pg + 5 && k <= pages; k++) batch.push(callApi(op, p, k, svc));
    (await Promise.all(batch)).forEach(x => items = items.concat(x.items));
  }
  return { items, total: first.total, truncated: first.total > items.length };
}

/* 지번별 표제부를 하나로 합치고(같은 대장은 처음 나온 지번에만), 지번별·전체 합계를 계산 */
function mergeLots(){
  const lots = result.lots, seen = new Set(), seenR = new Set(), seenP = new Set();
  const pk = it=>String(it.mgmBldrgstPk || "") || JSON.stringify([it.bldNm, it.dongNm, it.archArea, it.totArea]);
  const merged = [];
  lots.forEach(q=>{
    const T = q.regs?.getBrTitleInfo, R = q.regs?.getBrRecapTitleInfo;
    q.own = [];
    (T?.items || []).forEach(it=>{ const k = pk(it); if (seen.has(k)) return; seen.add(k); it._jibun = q.label; q.own.push(it); merged.push(it); });
    q.recap = null;
    (R?.items || []).forEach(it=>{ const k = pk(it); if (seenR.has(k)) return; seenR.add(k); if (!q.recap) q.recap = it; });
    const num = k=>q.own.reduce((s, t)=>s + (+t[k] || 0), 0);
    let plat = +q.recap?.platArea || 0;
    if (!plat){ const tp = Math.max(0, ...q.own.map(t=>+t.platArea || 0)); if (tp && !seenP.has(tp)){ plat = tp; seenP.add(tp); } } // 표제부 대지면적은 대지 전체 값이라 같은 값은 한 번만
    q.sum = {n: q.own.length, plat,
      arch: num("archArea"), tot: num("totArea"), heit: Math.max(0, ...q.own.map(t=>+t.heit || 0)),
      err: T?.error || ""};
  });
  if (lots.length > 1){
    const T = result.regs.getBrTitleInfo;
    result.regs.getBrTitleInfo = {items: merged, total: merged.length, truncated: lots.some(q=>q.regs?.getBrTitleInfo?.truncated), error: merged.length ? undefined : T.error};
  } else (result.regs.getBrTitleInfo.items || []).forEach(it=>it._jibun = lots[0].label);
  const S = k=>lots.reduce((s, q)=>s + q.sum[k], 0);
  result.total = {n: S("n"), plat: S("plat"), arch: S("arch"), tot: S("tot"), heit: Math.max(0, ...lots.map(q=>q.sum.heit))};
}
async function fetchAll(j, p, lots){
  lots = lots && lots.length ? lots : [Object.assign({}, p, {label: lotLabel(p)})];
  result = { juso: j, params: p, lots, at: new Date(), regs: {} };
  filterTxt = "";
  const nAll = REGS.length + (lots.length - 1) * 2;
  $("#out").innerHTML = targetCard() + `<div class="card noprint"><span class="spinner"></span>건축물대장 조회 중${lots.length > 1 ? ` (지번 ${lots.length}개)` : ""}… <span id="progN">0</span>/${nAll}</div>`;
  let done = 0;
  const run = async reg=>{
    try { result.regs[reg.op] = await fetchOne(reg.op, p, reg.svc); }
    catch(err){ result.regs[reg.op] = { error: err.message, items: [], total: 0 }; }
  };
  // 동시에 4개씩만 호출 (한꺼번에 몰리면 서버가 간헐적으로 오류를 냄)
  const pool = async (list, onDone)=>{
    const q = list.slice();
    await Promise.all(Array.from({length: 4}, async ()=>{ while (q.length){ await run(q.shift()); onDone?.(); } }));
  };
  await pool(REGS, ()=>{ const n = $("#progN"); if (n) n.textContent = ++done; });
  // 다른 대장은 있는데 0건/오류로 온 항목은 서버 일시 오류일 수 있으니 한 번 더 확인
  if (REGS.some(reg=>result.regs[reg.op].items.length)){
    const again = REGS.filter(reg=>{ const r = result.regs[reg.op]; return !r.items.length && !/활용신청되지 않은|SERVICE_KEY|등록되지 않은/.test(r.error || ""); });
    const prev = Object.fromEntries(again.map(reg=>[reg.op, result.regs[reg.op]]));
    if (again.length) await pool(again);
    again.forEach(reg=>{ if (result.regs[reg.op].error && !prev[reg.op].error) result.regs[reg.op] = prev[reg.op]; });
  }
  // 대장의 부속지번도 함께 넣기 (건물이 여러 지번에 걸쳐 있음)
  (result.regs.getBrAtchJibunInfo?.items || []).forEach(a=>{
    if (!a.atchSigunguCd || !a.atchBjdongCd || a.atchBun == null) return;
    const q = {sigunguCd: String(a.atchSigunguCd), bjdongCd: String(a.atchBjdongCd), platGbCd: String(a.atchPlatGbCd) === "1" ? "1" : "0",
      bun: String(a.atchBun).padStart(4,"0"), ji: String(a.atchJi || 0).padStart(4,"0")};
    const m = String(a.atchPlatPlc || "").match(/(\S+?)\s+(?:산\s*)?\d+(?:-\d+)?\s*(?:번지)?\s*$/);
    q.dong = q.bjdongCd === p.bjdongCd && q.sigunguCd === p.sigunguCd ? p.dong : (m ? m[1] : "");
    q.label = lotLabel(q); q.atch = true;
    if (!lots.some(x=>lotPnu(x) === lotPnu(q))) lots.push(q);
  });
  // 추가 지번: 총괄표제부·표제부만 (호출 수를 줄이기 위해)
  const prog = ()=>{ const n = $("#progN"); if (n) n.textContent = ++done; };
  { const t = $("#progN")?.parentElement; if (t && lots.length > 1) t.lastChild.textContent = "/" + (done + (lots.length - 1) * 2); }
  lots[0].regs = {getBrRecapTitleInfo: result.regs.getBrRecapTitleInfo, getBrTitleInfo: result.regs.getBrTitleInfo};
  for (const q of lots.slice(1)){
    q.regs = {};
    for (const op of ["getBrRecapTitleInfo", "getBrTitleInfo"]){
      try { q.regs[op] = await fetchOne(op, q); } catch(err){ q.regs[op] = {error: err.message, items: [], total: 0}; }
      prog();
    }
  }
  mergeLots();
  render();
}

let filterTxt = "";
function targetCard(){
  const {juso:j, params:p} = result;
  return `<div class="card tcard">
    <div class="printhead"><h1 style="font-size:18px;margin:0">건축물대장 조회 결과 (참고용)</h1></div>
    <div class="target">
      <div style="min-width:0">

/* ---------- 슬라이드 넘기기 ---------- */
let deckIdx = 0, deckRO = null;
function deckEls(){ return [...document.querySelectorAll("#slides > .slide")]; }
function slideStep(){ const s = $("#slides"); return s.clientWidth + parseFloat(getComputedStyle(s).columnGap || 0); }
function goTo(target, smooth = true){
  const els = deckEls(); if (!els.length) return;
  let i = typeof target === "number" ? target : els.findIndex(el=>el.id === "sec-"+target);
  if (i < 0) return;
  i = Math.max(0, Math.min(els.length - 1, i));
  $("#slides").scrollTo({left: i * slideStep(), behavior: smooth ? "smooth" : "auto"});
  setActive(i);
  const gap = $("#slides").getBoundingClientRect().top - $(".pager").offsetHeight;
  if (gap < 0) window.scrollBy({top: gap, behavior: smooth ? "smooth" : "auto"});
}
function setActive(i){
  const els = deckEls(); if (!els[i]) return;
  deckIdx = i;
  $("#slides").style.height = els[i].offsetHeight + "px";
  $("#pvPrev").disabled = i === 0;
  $("#pvNext").disabled = i === els.length - 1;
  const id = els[i].id.slice(4);
  if (id === "summary") initMap();
  document.querySelectorAll("#tabs .tab").forEach(c=>{
    const on = c.dataset.op === id;
    c.classList.toggle("cur", on); c.setAttribute("aria-selected", on);
    if (on){ const t = $("#tabs"); t.scrollTo({left: c.offsetLeft - (t.clientWidth - c.offsetWidth)/2, behavior:"smooth"}); }
  });
}
function initDeck(){
  const box = $("#slides");
  deckIdx = 0; setActive(0);
  let raf = 0;
  box.addEventListener("scroll", ()=>{
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(()=>{
      const i = Math.round(box.scrollLeft / slideStep());
      if (i !== deckIdx) setActive(i);
    });
  }, {passive:true});
  $("#pvPrev").onclick = ()=>goTo(deckIdx - 1);
  $("#pvNext").onclick = ()=>goTo(deckIdx + 1);
  if (deckRO) deckRO.disconnect();
  deckRO = new ResizeObserver(()=>{ const el = deckEls()[deckIdx]; if (el) box.style.height = el.offsetHeight + "px"; });
  deckEls().forEach(el=>deckRO.observe(el));
}
window.addEventListener("resize", ()=>{ if ($("#slides")) goTo(deckIdx, false); });
document.addEventListener("keydown", e=>{
  if (!$("#slides") || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.target.closest?.(".leaflet-container") || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight"){ goTo(deckIdx + 1); e.preventDefault(); }
  if (e.key === "ArrowLeft"){ goTo(deckIdx - 1); e.preventDefault(); }
});

/* 지도 위 글자표(건물 이름·미연결·음영 결과)를 필지 경계 밖으로 꺼내고 지시선으로 건물과 잇기 */
function makeLabeler(LF, map){
  const layer = LF.layerGroup().addTo(map), groups = {}, show = {}, pinned = {};
  const g = document.createElement("canvas").getContext("2d");
  g.font = `800 13.5px Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
  let rings = [], parcelRings = [];
  const api = {
    set(key, items){ groups[key] = items; api.layout(); },
    show(key, v){ show[key] = v; api.layout(); },
    roofs(r){ rings = r; },
    parcel(r){ parcelRings = r; },
    layout(){
      layer.clearLayers();
      const placed = [];
      const ll = (x, y)=>map.containerPointToLatLng(LF.point(x, y));
      const inAny = (x, y, rs)=>{ const q = ll(x, y); return rs.some(r=>inRing([q.lng, q.lat], r)); };
      const hits = r=>placed.some(q=>!(r.x1 + 3 < q.x0 || r.x0 - 3 > q.x1 || r.y1 + 3 < q.y0 || r.y0 - 3 > q.y1));
      // 필지 경계(없으면 건물들)의 화면상 중심
      const ppts = (parcelRings.length ? parcelRings : rings).flat().map(q=>map.latLngToContainerPoint([q[1], q[0]]));
      const pc = ppts.length ? [ppts.reduce((s,p)=>s + p.x, 0)/ppts.length, ppts.reduce((s,p)=>s + p.y, 0)/ppts.length] : [0, 0];
      const blocked = parcelRings.length ? parcelRings : rings;
      for (const key of Object.keys(groups)){
        if (show[key] === false) continue;
        const merged = [];
        for (const it of groups[key]){
          if (!it.ring?.length) continue;
          const same = merged.find(m=>m.text === it.text && m.cls === it.cls);
          if (same) same.rings.push(it.ring); else merged.push({...it, rings:[it.ring]});
        }
        for (const it of merged){
          const pk = key + "|" + it.text;
          const allPts = it.rings.map(r=>r.map(q=>map.latLngToContainerPoint([q[1], q[0]])));
          const pts = allPts.flat();
          const bc = [pts.reduce((s,p)=>s + p.x, 0)/pts.length, pts.reduce((s,p)=>s + p.y, 0)/pts.length];
          const w = g.measureText(it.text).width + 14, h = 21;
          const rect = (x, y)=>({x0:x - w/2, y0:y - h/2, x1:x + w/2, y1:y + h/2});
          // 건물 이름·그늘 결과: 지시선 없이 건물 바로 위 또는 좌우에 글자 상자
          if (/shng/.test(it.cls || "")){
            const x0 = Math.min(...pts.map(p=>p.x)), x1 = Math.max(...pts.map(p=>p.x)), y0 = Math.min(...pts.map(p=>p.y)), y1 = Math.max(...pts.map(p=>p.y));
            const W2 = w + 4, H2 = 22, cy = (y0 + y1)/2;
            const R = (x, y)=>({x0:x - W2/2, y0:y - H2/2, x1:x + W2/2, y1:y + H2/2});
            const cands = [];
            for (const gap of [3, 14, 28]) cands.push(R(bc[0], y0 - gap - H2/2), R(x0 - gap - W2/2, cy), R(x1 + gap + W2/2, cy));
            const onRoofR = r=>[[ (r.x0+r.x1)/2, (r.y0+r.y1)/2 ], [r.x0+3, r.y0+3], [r.x1-3, r.y0+3], [r.x0+3, r.y1-3], [r.x1-3, r.y1-3]].some(([x, y])=>inAny(x, y, rings));
            const pick = cands.find(r=>!hits(r) && !onRoofR(r)) || cands.find(r=>!hits(r)) || cands[0];
            placed.push(pick);
            layer.addLayer(LF.tooltip({permanent:true, direction:"center", className:"tag " + it.cls, interactive:false})
              .setLatLng(ll((pick.x0 + pick.x1)/2, (pick.y0 + pick.y1)/2)).setContent(esc(it.text)));
            continue;
          }
          const outside = r=>![[ (r.x0+r.x1)/2, (r.y0+r.y1)/2 ], [r.x0, r.y0], [r.x1, r.y0], [r.x0, r.y1], [r.x1, r.y1]].some(([x, y])=>inAny(x, y, blocked));
          const pinC = pinned[pk] && map.latLngToContainerPoint(pinned[pk]);
          let a0 = Math.atan2(bc[1] - pc[1], bc[0] - pc[0]);
          if (!isFinite(a0) || Math.hypot(bc[0] - pc[0], bc[1] - pc[1]) < 1) a0 = Math.PI/2;
          let best = null, bestCost = Infinity;
          if (pinC) best = rect(pinC.x, pinC.y); // 사용자가 옮겨 둔 자리
          else for (const da of [0, 0.3, -0.3, 0.6, -0.6, 0.9, -0.9, 1.25, -1.25, 1.6, -1.6, 2.1, -2.1, 2.6, -2.6, Math.PI]){
            const ux = Math.cos(a0 + da), uy = Math.sin(a0 + da);
            for (let t = 10; t <= 700; t += 8){
              const r = rect(bc[0] + ux*t, bc[1] + uy*t);
              if (!outside(r)) continue;
              const r2 = rect(bc[0] + ux*(t + 12), bc[1] + uy*(t + 12)); // 경계선에서 살짝 띄움
              if (hits(r2)) continue;
              const cost = t + Math.abs(da)*60;
              if (cost < bestCost){ bestCost = cost; best = r2; }
              break;
            }
          }
          if (!best) best = rect(bc[0], bc[1]);
          placed.push(best);
          const drag = m=>{ // 끌어서 옮기기 · 두 번 클릭하면 자동 위치로
            m.on("dragend", ()=>{ const tl = map.latLngToContainerPoint(m.getLatLng()); pinned[pk] = ll(tl.x + (best.x1 - best.x0)/2, tl.y + (best.y1 - best.y0)/2); api.layout(); });
            m.on("dblclick", e=>{ LF.DomEvent.stop(e); delete pinned[pk]; api.layout(); });
            return m;
          };
          if (/name/.test(it.cls || "")){ // 건물 이름: 필지 밖 상자, 지시선 없음
            layer.addLayer(drag(LF.marker(ll(best.x0, best.y0), {draggable:true, keyboard:false, title:"끌어서 옮기기 · 두 번 클릭하면 자동 위치",
              icon: LF.divIcon({className:"cadicon", iconSize:[best.x1 - best.x0, best.y1 - best.y0], iconAnchor:[0, 0], html:`<div class="tagm">${esc(it.text)}</div>`})})));
            continue;
          }
          // 도면식 지시선: 글자 밑줄 끝(건물 쪽) → 건물 외곽선까지, 끝에 화살표. 글자·밑줄·지시선은 같은 색
          const c_ = it.cls || "";
          const col = it.line || (/nodraw|shng/.test(c_) ? "#dc2626" : /nolink/.test(c_) ? "#d97706" : "#1d5fd6");
          const tcol = it.color || col, halo = /^#f[a-f0-9]c/i.test(col) || col === "#facc15" ? "#000" : "#fff";
          const sh = [bc[0] < (best.x0 + best.x1)/2 ? best.x0 : best.x1, best.y1];
          for (const rp of allPts){
            const rc = [rp.reduce((t,p)=>t + p.x, 0)/rp.length, rp.reduce((t,p)=>t + p.y, 0)/rp.length];
            let tip = null, dm = Infinity;
            for (let k = 0; k < rp.length; k++){ // 밑줄 끝에서 가장 가까운 외곽선 위 점
              const A = rp[k], B = rp[(k+1) % rp.length], dx = B.x - A.x, dy = B.y - A.y, L2 = dx*dx + dy*dy;
              const u = L2 ? Math.max(0, Math.min(1, ((sh[0]-A.x)*dx + (sh[1]-A.y)*dy)/L2)) : 0;
              const q = [A.x + u*dx, A.y + u*dy], d = Math.hypot(q[0]-sh[0], q[1]-sh[1]);
              if (d < dm){ dm = d; tip = q; }
            }
            const ib = Math.hypot(rc[0]-tip[0], rc[1]-tip[1]) || 1, inset = Math.min(6, ib*0.5); // 외곽선에서 조금 안쪽으로
            tip = [tip[0] + (rc[0]-tip[0])/ib*inset, tip[1] + (rc[1]-tip[1])/ib*inset];
            const L1 = Math.hypot(tip[0]-sh[0], tip[1]-sh[1]) || 1, ux = (tip[0]-sh[0])/L1, uy = (tip[1]-sh[1])/L1;
            const base = [tip[0] - ux*11, tip[1] - uy*11];
            const line = [ll(sh[0], sh[1]), ll(base[0], base[1])];
            layer.addLayer(LF.polyline(line, {color:col, weight:2, interactive:false}));
            layer.addLayer(LF.polygon([ll(tip[0], tip[1]), ll(base[0] - uy*4.5, base[1] + ux*4.5), ll(base[0] + uy*4.5, base[1] - ux*4.5)],
              {stroke:false, fillColor:col, fillOpacity:1, interactive:false}));
          }
          layer.addLayer(drag(LF.marker(ll(best.x0, best.y0), {draggable:true, keyboard:false, title:"끌어서 옮기기 · 두 번 클릭하면 자동 위치",
            icon: LF.divIcon({className:"cadicon", iconSize:[best.x1 - best.x0, best.y1 - best.y0], iconAnchor:[0, 0],
              html:`<div class="cad" style="--c:${tcol};--l:${col}">${esc(it.text)}</div>`})})));
        }
      }
    }
  };
  map.on("zoomend", ()=>api.layout());
  map.on("resize", ()=>api.layout());
  return api;
}

function polysOf(f){ const g = f.geometry; return g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : []; }

function setupOverlay(LF, map, ctx){

  function checkUnlinked(again){

      if (hit/tot >= 0.5){ nIn++; ctx.toRegistered(c); }       // 도면에 그려져 있음 → 대장 건물의 일부로 봄
      else { nOut++; if (!c.edited) c.text = "현황도에 없음 · 확인 요망"; }
    });
    ctx.refreshChecks?.();
    if (again) nIn += ov.nIn || 0;
    ov.nIn = nIn; ov.nOut = nOut;
    ov.sum = (nIn + nOut) ? `현황도 비교: 대장 미연결 ${nIn + nOut}곳 중 <b style="color:#c62828">현황도에 없음 ${nOut}곳</b>` + (nIn ? ` · 현황도에 그려져 있어 대장 건물로 바꾼 곳 ${nIn}곳` : "") : "";
    showSum();
  }
  function showSum(){
    const el = $("#ovSum") || (()=>{ const d = document.createElement("div"); d.id = "ovSum"; d.className = "mapnote"; ctx.st.after(d); return d; })();
    el.innerHTML = ov.sum || "";
  }

  $("#ovOp").addEventListener("input", e=>img.style.opacity = e.target.value / 100);
  $("#ovClip").addEventListener("change", clipImage);

  $("#ovRedo").addEventListener("click", ()=>{
    ov.dpts = []; ov.mpts = []; ov.T = null; img.style.display = "none";
    const cb = $('#mapBar [data-lay="draw"]'); if (cb){ cb.checked = false; cb.disabled = true; }
    ctx.fills?.();
    $("#ovPick").hidden = false; $("#ovCtl").hidden = true; setWide(true);
    setTimeout(()=>{ map.invalidateSize(); drawPick(); }, 230); nextStep();
  });

  // 레플릿은 누르는 동안 3픽셀만 움직여도 '끌기'로 보고 클릭을 버림 → 8픽셀까지는 클릭으로 받음
  let downAt = null;
  const mc = map.getContainer();
  mc.addEventListener("pointerdown", e=>{ downAt = ov.step === "m" && e.button === 0 && !e.target.closest(".leaflet-control") ? [e.clientX, e.clientY] : null; }, true);
  mc.addEventListener("pointerup", e=>{
    if (!downAt || ov.step !== "m") return;
    const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); downAt = null;
    if (moved > 8) return; // 지도를 끌어 옮긴 것
    pickMap({latlng: map.mouseEventToLatLng(e)});
  }, true);
  function pickMap(e){
    {
      const prev = ov.mpts[ov.mpts.length - 1];
      if (prev && map.distance(prev, e.latlng) < 3){ step(`<b>④ 위 지도</b>에서 <b style="color:#e53935">2번 점</b>을 찍어 주세요. <span style="color:#c62828">(1번 점과 너무 가깝습니다 — 도면 2번 점과 같은 모서리를 한 번만 클릭)</span>`); return; }
      ov.mpts.push(e.latlng);
      ov.tmp.addLayer(LF.circleMarker(e.latlng, {radius:8, color:"#e53935", weight:3, fillColor:"#fff", fillOpacity:1}));
      ov.tmp.addLayer(LF.tooltip({permanent:true, direction:"right", offset:[8,0], className:"mlabel"}).setLatLng(e.latlng).setContent(String(ov.mpts.length)));
      nextStep();
      map.getContainer().classList.toggle("measuring", ov.step === "m");
      if (ov.mpts.length === 1) flash("1번 점을 찍었습니다 — 이제 2번 점");
    }
  }
  const flash = t=>{ const d = LF.DomUtil.create("div", "mflash", mc); d.textContent = t; setTimeout(()=>d.remove(), 1600); };
  map.on("popupopen", ()=>{ if (ov.step === "m") map.closePopup(); });
  // ---- 각도·크기·위치 미세조정: 처음 맞춘 위치(T0)에서 필지 중심을 기준으로 살짝 돌리고 키우고 옮김 ----
  ov.adj = {rot:0, sc:0, dx:0, dy:0};
  const syncAdj = ()=>{ $("#ovRot").value = ov.adj.rot; $("#ovScl").value = ov.adj.sc;
    $("#ovRotV").textContent = ov.adj.rot.toFixed(2) + "°"; $("#ovSclV").textContent = ov.adj.sc.toFixed(2) + "%"; };
  const pivotOf = ()=>{
    const ring = ctx.parcelRings?.[0];
    if (ring?.length){ let x = 0, y = 0; ring.forEach(q=>{ const P = map.project([q[1], q[0]], Z0); x += P.x; y += P.y; }); return {x:x/ring.length, y:y/ring.length}; }
    const A = map.project(ov.mpts[0], Z0), B = map.project(ov.mpts[1], Z0); return {x:(A.x + B.x)/2, y:(A.y + B.y)/2};
  };
  function applyAdj(final){
    const T0 = ov.T0; if (!T0) return;
    const A = ov.adj, k = 1 + A.sc/100, d = A.rot*Math.PI/180, cd = Math.cos(d), sd = Math.sin(d);
    const Pv = ov.pivot || (ov.pivot = pivotOf());
    const mpp = 40075016.686*Math.cos(ov.mpts[0].lat*Math.PI/180)/(256*Math.pow(2, Z0));
    const rot = (x, y)=>[cd*x - sd*y, sd*x + cd*y];
    const [a1, a2] = rot(T0.tx, T0.ty), [b1, b2] = rot(Pv.x, Pv.y);
    ov.T = {s: T0.s*k, c: T0.c*cd - T0.sn*sd, sn: T0.sn*cd + T0.c*sd,
            tx: k*a1 + Pv.x - k*b1 + A.dx/mpp, ty: k*a2 + Pv.y - k*b2 + A.dy/mpp};
    place();
    if (final){ clipImage(); checkUnlinked(true); ctx.fills?.(); }
  }
  const settle = ()=>{ clearTimeout(ov.adjT); ov.adjT = setTimeout(()=>applyAdj(true), 350); };
  $("#ovRot").addEventListener("input", e=>{ ov.adj.rot = +e.target.value; syncAdj(); applyAdj(false); settle(); });
  $("#ovScl").addEventListener("input", e=>{ ov.adj.sc = +e.target.value; syncAdj(); applyAdj(false); settle(); });
  $("#ovCtl").addEventListener("click", e=>{
    if (e.target.id === "ovAdjReset"){ ov.adj = {rot:0, sc:0, dx:0, dy:0}; syncAdj(); applyAdj(true); return; }
    const m = e.target.dataset.mv; if (!m) return;
    const st = 0.2; if (m === "l") ov.adj.dx -= st; if (m === "r") ov.adj.dx += st; if (m === "u") ov.adj.dy -= st; if (m === "d") ov.adj.dy += st;
    applyAdj(false); settle();
  });
  const sumTxt = ()=>{ const nIn = ov.nIn || 0, nOut = ov.nOut || 0; return (nIn + nOut) ? `현황도 비교: 대장 미연결 ${nIn + nOut}곳 중 <b style="color:#c62828">현황도에 없음 ${nOut}곳</b>` + (nIn ? ` · 현황도에 그려져 있어 대장 건물로 바꾼 곳 ${nIn}곳` : "") : ""; };
  return {show: v=>{ img.style.display = v && ov.T ? "" : "none"; },
    removed: ()=>{ if (!ov.sum) return; ov.nOut = Math.max(0, (ov.nOut || 0) - 1); ov.sum = sumTxt(); showSum(); }};
}

/* 거리 재기: 📏 버튼 → 클릭으로 점 추가(십자선 원) → 더블클릭/우클릭으로 끝, Esc 취소, 🗑 전체 지우기 */
function addMeasure(LF, map, regArea){
  const color = "#ff1f6b", acolor = "#ffd400";
  const icon = c=>LF.divIcon({className:"mvtx", iconSize:[26,26], iconAnchor:[13,13],
    html:`<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="7" fill="rgba(255,255,255,.85)" stroke="${c}" stroke-width="2.5"/>
      <path d="M13 1v8M13 17v8M1 13h8M17 13h8" stroke="${c}" stroke-width="1.6"/><circle cx="13" cy="13" r="1.2" fill="${c}"/></svg>`});
  const group = LF.layerGroup().addTo(map);
  const fmtD = d=>d >= 1000 ? (d/1000).toFixed(2) + "km" : d.toFixed(1) + "m";
  const fmtA = a=>a.toLocaleString("ko-KR", {maximumFractionDigits:1}) + "㎡";
  const sum = pts=>pts.reduce((s,p,i)=>i ? s + map.distance(pts[i-1], p) : 0, 0);
  const polyArea = pts=>{
    const lat0 = pts[0].lat * Math.PI / 180, kx = 111320 * Math.cos(lat0), ky = 110540;
    let s = 0;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) s += pts[j].lng*kx * pts[i].lat*ky - pts[i].lng*kx * pts[j].lat*ky;
    return Math.abs(s) / 2;
  };
  let mode = null, cur = null, btns = {}, areas = [];

  const hint = LF.DomUtil.create("div", "mhint", map.getContainer());
  const HINT = {
    len: "점을 클릭하면 구간 길이 표시 · 더블클릭/우클릭: 끝내기 · Esc: 측정 지우기",
    area: "지붕 모서리를 차례로 클릭 → 3번째 점부터 면적 바로 표시 · 첫 점 다시 클릭/더블클릭: 끝 · Esc: 측정 지우기"
  };
  const Ctl = LF.Control.extend({ onAdd(){
    const d = LF.DomUtil.create("div", "leaflet-bar mctl");
    d.innerHTML = `<a href="#" role="button" title="거리 재기 — 점을 클릭할 때마다 구간 길이가 표시됩니다 (더블클릭·우클릭으로 끝)" data-a="len">📏</a><a href="#" role="button" title="면적 재기 — 지붕 모서리를 차례로 클릭하면 3번째 점부터 면적이 나오고 대장 건축면적과 비교합니다" data-a="area">⬠</a><a href="#" role="button" title="측정 지우기 — 그린 거리·면적 표시를 모두 지웁니다 (Esc 키로도 작동합니다)" data-a="clear">🗑</a>`;
    d.querySelectorAll("a").forEach(a=>btns[a.dataset.a] = a);
    LF.DomEvent.disableClickPropagation(d);
    LF.DomEvent.on(d, "click", e=>{
      LF.DomEvent.preventDefault(e);
      const a = e.target.closest("a")?.dataset.a;
      if (a === "len" || a === "area") setMode(mode === a ? null : a);
      if (a === "clear") clearAll();
    });
    return d;
  }});
  map.addControl(new Ctl({position:"topleft"}));

  // 그린 면적 합계 ↔ 대장 건축면적 비교 상자
  const box = LF.DomUtil.create("div", "areabox", map.getContainer());
  LF.DomEvent.disableClickPropagation(box);
  function showSum(){
    if (!areas.length){ box.style.display = "none"; return; }
    const tot = areas.reduce((s,a)=>s + a, 0);
    let h = `<b>그린 면적 합계 ${fmtA(tot)}</b> (${areas.length}곳)`;
    if (regArea > 0){
      const diff = tot - regArea, pct = diff / regArea * 100;
      h += `<br>대장 건축면적 합계 ${fmtA(regArea)}<br>차이 <b style="color:${diff > 0 ? "#d32f2f" : "#1b7f3b"}">${diff > 0 ? "+" : ""}${fmtA(diff)} (${pct > 0 ? "+" : ""}${pct.toFixed(1)}%)</b>`;
      if (pct > 10) h += `<br><span style="color:#d32f2f;font-weight:700">⚠ 대장보다 넓음 — 무단 증축·불법 구조물 의심</span>`;
      else if (pct >= -10) h += `<br><span style="color:#1b7f3b">대장 면적과 비슷함</span>`;
    }
    h += `<br><span class="hint">항공사진으로 따라 그린 값이라 오차가 있습니다 (참고용)</span>`;
    box.innerHTML = h; box.style.display = "block";
  }

  function clearAll(){ cancel(); group.clearLayers(); areas = []; showSum(); }
  window.measureHas = ()=>!!mode || group.getLayers().length > 0;
  function setMode(v){
    finish();
    mode = v;
    map.getContainer().classList.toggle("measuring", !!v);
    Object.entries(btns).forEach(([k, b])=>b.classList.toggle("active", k === v));
    hint.textContent = HINT[v] || "";
    if (v){ map.doubleClickZoom.disable(); map.closePopup(); }
    else map.doubleClickZoom.enable();
  }
  function tip(ll, text, cls, dir, off){
    const t = LF.tooltip({permanent:true, direction:dir, offset:off, className:cls, interactive:false}).setLatLng(ll).setContent(text);
    group.addLayer(t); cur.layers.push(t); return t;
  }
  const mid = (a, b)=>LF.latLng((a.lat + b.lat)/2, (a.lng + b.lng)/2);
  // 거리 모드: 점 3개 이상이면 마지막 점에 전체 길이 표시
  function total(){
    if (cur.mode !== "len") return;
    if (cur.pts.length < 3){ if (cur.total){ group.removeLayer(cur.total); cur.total = null; } return; }
    const ll = cur.pts[cur.pts.length-1], txt = "합계 " + fmtD(sum(cur.pts));
    if (cur.total) cur.total.setLatLng(ll).setContent(txt);
    else cur.total = tip(ll, txt, "mlabel mtotal", "bottom", [0,14]);
  }
  function finish(){
    if (!cur) return;
    if (cur.mode === "area"){
      if (cur.pts.length < 3) cur.layers.forEach(l=>group.removeLayer(l));
    } else if (cur.pts.length < 2) cur.layers.forEach(l=>group.removeLayer(l));
    cur = null;
  }
  function cancel(){
    if (!cur) return;
    cur.layers.forEach(l=>group.removeLayer(l));
    if (cur.idx !== undefined){ areas.splice(cur.idx, 1); showSum(); }
    cur = null;
  }
  // 면적 모드: 점 3개부터 바로 면적 표시, 점을 찍을 때마다 갱신
  function liveArea(){
    const p = cur.pts;
    if (cur.mode !== "area" || p.length < 3) return;
    const a = polyArea(p), close = mid(p[p.length-1], p[0]), txt = fmtD(map.distance(p[p.length-1], p[0]));
    const c = LF.polygon(p).getBounds().getCenter();
    if (cur.close) cur.close.setLatLng(close).setContent(txt); else cur.close = tip(close, txt, "mlabel", "center", [0,0]);
    if (cur.alabel) cur.alabel.setLatLng(c).setContent("면적 " + fmtA(a)); else cur.alabel = tip(c, "면적 " + fmtA(a), "mlabel marea", "center", [0,0]);
    if (cur.idx === undefined) cur.idx = areas.push(a) - 1; else areas[cur.idx] = a;
    showSum();
  }

  map.on("click", e=>{
    if (!mode) return;
    if (!cur){
      const c = mode === "area" ? acolor : color;
      const shape = mode === "area"
        ? LF.polygon([], {color:c, weight:3, fillColor:c, fillOpacity:0.25, interactive:false})
        : LF.polyline([], {color:c, weight:4, interactive:false});
      cur = {mode, pts:[], layers:[shape], total:null, shape};
      group.addLayer(shape);
    }
    const last = cur.pts[cur.pts.length-1];
    if (last && map.latLngToContainerPoint(last).distanceTo(e.containerPoint) < 5) return; // 더블클릭의 중복 점 무시
    // 면적 모드에서 첫 점을 다시 누르면 도형 닫고 끝
    if (cur.mode === "area" && cur.pts.length >= 3 && map.latLngToContainerPoint(cur.pts[0]).distanceTo(e.containerPoint) < 12){ finish(); return; }
    cur.pts.push(e.latlng);
    cur.shape.setLatLngs(cur.pts);
    const m = LF.marker(e.latlng, {icon: icon(cur.mode === "area" ? "#e6a800" : color), interactive:false, keyboard:false});
    group.addLayer(m); cur.layers.push(m);
    // 두 점을 찍으면 그 구간 길이를 선 가운데에 고정 표시
    if (last) tip(mid(last, e.latlng), fmtD(map.distance(last, e.latlng)), "mlabel", "center", [0,0]);
    total();
    liveArea();
  });
  map.on("dblclick contextmenu", e=>{
    if (!mode) return;
    e.originalEvent?.preventDefault();
    finish();
  });
  map.on("popupopen", ()=>{ if (mode) map.closePopup(); });
  document.addEventListener("keydown", e=>{ if (e.key !== "Escape" || !window.measureHas()) return; if (e.target.closest?.("input,select,textarea")) return; clearAll(); });
  return {off: ()=>{ if (mode) setMode(null); }};
}

/* 브이월드 건물(GIS) ↔ 표제부 매칭: 동명칭 → 동번호 → 연면적 → 높이+층수 순 */
function join2s(a, b){ return [a, b].map(x=>String(x ?? "").trim()).filter((x,i,arr)=>x && arr.indexOf(x)===i).join(" / "); }
function matchTitle(a, titles){
  if (!titles.length) return null;
  const norm = s=>String(s ?? "").replace(/\s+/g, "");
  const num = s=>(norm(s).match(/\d+/) || [""])[0];
  const pick = c=>{
    if (c.length > 1 && a.bld_nm){ const b = c.filter(t=>norm(t.bldNm) === norm(a.bld_nm)); if (b.length) c = b; }
    return c[0] || null;
  };
  const dn = norm(a.dong_nm);
  let c = dn ? titles.filter(t=>norm(t.dongNm) === dn) : [];
  if (!c.length && num(a.dong_nm)) c = titles.filter(t=>num(t.dongNm) === num(a.dong_nm));
  if (!c.length && +a.totalarea) c = titles.filter(t=>Math.abs(+t.totArea - +a.totalarea) <= Math.max(1, +a.totalarea * 0.005));
  if (!c.length && +a.height) c = titles.filter(t=>Math.abs(+t.heit - +a.height) < 0.05 && +t.grndFlrCnt === +a.grnd_flr);
  return pick(c);
}
/* 외곽선 바닥면적(㎡) — 좁은 범위라 평면 근사로 충분 */
function footArea(f){
  const ringA = ring=>{
    const lat0 = ring[0]?.[1] * Math.PI / 180 || 0, kx = 111320 * Math.cos(lat0), ky = 110540;
    let s = 0;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) s += (ring[j][0]*kx) * (ring[i][1]*ky) - (ring[i][0]*kx) * (ring[j][1]*ky);
    return Math.abs(s) / 2;
  };
  return polysOf(f).reduce((s, poly)=>s + ringA(poly[0] || []) - poly.slice(1).reduce((h, r)=>h + ringA(r), 0), 0);
}
/* 지도 건물 ↔ 표제부 짝짓기
   1) 브이월드에 속성(건물명·동명칭·연면적·높이)이 있는 건물 = 대장 등록 건물 (여러 조각이 한 대장 건물에 붙을 수 있음)
   2) 속성이 빈 건물은 외곽선 면적 ↔ 표제부 건축면적이 가까운 것끼리 짝짓기 (시골 공장·창고는 속성이 비어 있는 경우가 많음)
   3) 1:1로 남으면 연결
   4) 연결된 건물에 딱 붙은 조각은 같은 건물의 일부로 봄 — 단, 연결 면적 합이 대장 건축면적 합의 115%를 넘지 않을 때까지만
      (넘는 부분은 대장보다 넓은 것이므로 미연결로 남겨 무단 증축 의심으로 보이게 함) */
function polyGap(f1, f2){
  const r0 = polysOf(f1)[0]?.[0]?.[0]; if (!r0) return Infinity;
  const kx = 111320*Math.cos(r0[1]*Math.PI/180), ky = 110540;
  const xy = f=>polysOf(f).map(poly=>poly[0].map(q=>[(q[0]-r0[0])*kx, (q[1]-r0[1])*ky]));
  const A = xy(f1), B = xy(f2);
  const segD = (p, a, b)=>{ const dx = b[0]-a[0], dy = b[1]-a[1], L = dx*dx + dy*dy;
    const t = L ? Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L)) : 0;
    return Math.hypot(p[0] - a[0] - t*dx, p[1] - a[1] - t*dy); };
  let m = Infinity;
  const one = (P, Q)=>P.forEach(rp=>rp.forEach(p=>Q.forEach(rq=>{
    if (inRing(p, rq)) m = 0;
    for (let i = 0; i < rq.length; i++) m = Math.min(m, segD(p, rq[i], rq[(i+1) % rq.length]));
  })));
  one(A, B); one(B, A);
  return m;
}
function linkBuildings(blds, titles){
  const info = blds.map(f=>({f, a:f.properties || {}, area:footArea(f), t:null, reg:false, how:""}));
  const hasAttr = a=>String(a.bld_nm || "").trim() || String(a.dong_nm || "").trim() || +a.totalarea > 0 || +a.height > 0;
  const used = new Set();
  info.forEach(b=>{
    if (!hasAttr(b.a)) return;
    b.reg = true; b.how = "속성";
    b.t = matchTitle(b.a, titles) || (titles.length === 1 ? titles[0] : null);
    if (b.t) used.add(b.t);
  });
  const pairs = [];
  info.filter(b=>!b.reg && b.area > 0).forEach(b=>titles.filter(t=>!used.has(t) && +t.archArea > 0).forEach(t=>{
    const diff = Math.abs(b.area - +t.archArea) / +t.archArea;
    if (diff <= 0.4) pairs.push({b, t, diff});
  }));
  pairs.sort((x, y)=>x.diff - y.diff).forEach(({b, t})=>{
    if (b.reg || used.has(t)) return;
    b.t = t; b.reg = true; b.how = "면적"; used.add(t);
  });
  const restB = info.filter(b=>!b.reg), restT = titles.filter(t=>!used.has(t));

/* ---------- 음영확인 (주변 건물 그림자 · 지붕 칸별 그늘 시간 · 필요 설치 높이) ---------- */
function sunPos(ms, lat, lon){
  const r = Math.PI/180, d = ms/86400000 + 2440587.5 - 2451545.0;
  const g = ((357.529 + 0.98560028*d) % 360) * r;
  const q = (280.459 + 0.98564736*d) % 360;
  const Lr = (q + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * r;
  const e = (23.439 - 0.00000036*d) * r;
  const ra = Math.atan2(Math.cos(e)*Math.sin(Lr), Math.cos(Lr));
  const dec = Math.asin(Math.sin(e)*Math.sin(Lr));
  const gmst = ((18.697374558 + 24.06570982441908*d) % 24 + 24) % 24;
  const H = (gmst*15 + lon)*r - ra, la = lat*r;
  const alt = Math.asin(Math.sin(la)*Math.sin(dec) + Math.cos(la)*Math.cos(dec)*Math.cos(H));
  const az = Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(la) - Math.tan(dec)*Math.cos(la)) / r + 180;
  return {alt: alt/r, az: (az % 360 + 360) % 360};
}
/* 점(px,py)에서 방향(ux,uy)으로 쏜 선이 다각형 테두리와 처음 만나는 거리 */
function rayHit(px, py, ux, uy, ring){
  let best = Infinity;
  for (let i = 0, n = ring.length; i < n; i++){
    const A = ring[i], B = ring[(i+1) % n];
    const ex = B[0]-A[0], ey = B[1]-A[1], den = ux*ey - uy*ex;
    if (Math.abs(den) < 1e-12) continue;
    const ax = A[0]-px, ay = A[1]-py;
    const t = (ax*ey - ay*ex) / den, s = (ax*uy - ay*ux) / den;
    if (t > 0 && s >= 0 && s <= 1 && t < best) best = t;
  }
  return best;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0] || a[1]-b[1]);
  const cr = (o,a,b)=>(a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for (const p of pts){ while (lo.length > 1 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while (up.length > 1 && cr(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0,-1).concat(up.slice(0,-1));
}

    const sp = sunPos(Date.UTC(y, mo-1, d, 0, m) - 9*3600e3, S.c0.lat, S.c0.lng);
    if (sp.alt > 1) S.times.push({m, alt: sp.alt, az: sp.az, tan: Math.tan(sp.alt*rad), ux: Math.sin(sp.az*rad), uy: Math.cos(sp.az*rad)});
  }
  const T = S.times, minTan = Math.min(...T.map(t=>t.tan));
  S.blds.forEach(b=>b.hit = false);
  S.cells.forEach(c=>{
    const z = c.b.h;
    // 이 칸에 그림자를 드리울 수 있는 건물만 (지붕보다 높고, 그림자 길이 안에 있는 것)
    const cand = S.blds.filter(o=>o !== c.b && o.h > z && !(o.mine && c.b.mine && o.src === "ledgermax" && c.b.src === "ledgermax") && Math.hypot(o.cx - c.x, o.cy - c.y) - o.rr <= (o.h - z)/minTan)
      .filter(o=>!o.rings.some(r=>inRing([c.x, c.y], r)));
    c.need = new Float32Array(T.length);
    let mx = 0;
    T.forEach((t, ti)=>{
      let v = 0;
      for (const o of cand){
        let dmin = Infinity;
        for (const r of o.rings){ const dd = rayHit(c.x, c.y, t.ux, t.uy, r); if (dd < dmin) dmin = dd; }
        if (dmin < Infinity){ const n = o.h - dmin*t.tan - z; if (n > v){ v = n; o.hit = true; } }
      }
      c.need[ti] = v; if (v > mx) mx = v;
    });
    c.max = mx;
  });
  const sl = $("#shT");
  sl.max = Math.max(0, T.length - 1);
  const noon = T.findIndex(t=>t.m >= 720);
  const keep = prevM != null ? T.findIndex(t=>t.m === prevM) : -1;
  sl.value = keep >= 0 ? keep : (noon >= 0 ? noon : 0);
}
function shadeDraw(){
  const S = shade; if (!S) return;
  const T = S.times, st = $("#shState");
  if (!T.length){ st.innerHTML = `<div class="msg warn">이 날짜·시간에는 해가 떠 있지 않습니다.</div>`; return; }
  const h = Math.max(0, +$("#shH").value || 0) / 1000, mode = $("#shMode").value, ti = Math.min(+$("#shT").value || 0, T.length - 1);
  const t = T[ti];
  const hhmm = m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
  const up = v=>Math.ceil(v*10)/10; // 0.1m(100mm) 단위로 올림
  const mm = v=>`${up(v).toFixed(1)}m (${Math.round(up(v)*1000).toLocaleString()}mm)`;
  $("#shClock").textContent = hhmm(t.m);
  const dirs = ["북","북동","동","남동","남","남서","서","북서"];
  $("#shSun").textContent = `해 높이 ${t.alt.toFixed(1)}° · 방향 ${dirs[Math.round(t.az/45) % 8]}(${t.az.toFixed(0)}°)`;

  // 칸 색칠 — 그늘 없는 칸은 칠하지 않고, 그늘 지는 칸만 노랑→빨강으로
  const col = f=>{
    f = Math.max(0, Math.min(1, f));
    const a = f < 0.5 ? [255,224,130] : [255,167,38], b = f < 0.5 ? [255,167,38] : [229,57,53], k = f < 0.5 ? f*2 : (f - 0.5)*2;
    return `rgb(${a.map((v,i)=>Math.round(v + (b[i]-v)*k)).join(",")})`;
  };
  const span = (T.length - 1) * 10 / 60 || 1/6;
  const maxNeed = Math.max(0.1, ...S.cells.map(c=>c.max - h));
  S.cells.forEach(c=>{
    let fill = "#000", op = 0;
    if (mode === "need"){ const v = c.max - h; if (v > 1e-6){ fill = col(v / maxNeed); op = 0.55; } }
    else if (mode === "now"){ if (c.need[ti] > h + 1e-6){ fill = "#3f51b5"; op = 0.55; } }
    else { const n = c.need.reduce((s,v)=>s + (v > h + 1e-6 ? 1 : 0), 0); if (n){ fill = col(n / T.length); op = 0.55; } }
    c.rect.setStyle({fillColor: fill, fillOpacity: op});
  });
  // 선택 시각: 그늘을 만드는 건물의 그림자만 연하게
  S.shadowLayer.clearLayers();
  if (mode === "now"){
    const z = S.minZ + h;
    S.blds.filter(o=>o.hit && o.h > z).forEach(o=>{
      const L = (o.h - z) / t.tan, dx = -t.ux*L, dy = -t.uy*L;
      o.rings.forEach(r=>{
        const hl = hull(r.concat(r.map(q=>[q[0] + dx, q[1] + dy])));
        S.shadowLayer.addLayer(S.LF.polygon(hl.map(q=>S.toLL(q[0], q[1])), {renderer:S.rnd, stroke:false, fillColor:"#000", fillOpacity:0.18, interactive:false}));
      });
    });
  }
  const hitCol = $("#shHitCol")?.value || "#ff9800";
  S.blds.forEach(o=>{ if (!o.mine) o.layer.setStyle(o.hit ? {color:hitCol, weight:2.5, opacity:1} : {color:"#fff", weight:1, opacity:0.5}); });

  // 지붕마다 결과 이름표 (그늘 없음 / 몇 mm 더 띄워야)
  const rows = S.roofs.map(b=>{
    const cs = S.cells.filter(c=>c.b === b);
    const shaded = cs.filter(c=>c.max > h + 1e-6).length;
    const hrs = cs.reduce((s,c)=>s + c.need.reduce((n,v)=>n + (v > h + 1e-6 ? 1 : 0), 0), 0);
    const srt = cs.map(c=>c.max).sort((x,y)=>x-y);
    return {b, n: cs.length, area: cs.length * S.cell * S.cell, shadedPct: cs.length ? shaded/cs.length*100 : 0,
      lossPct: cs.length ? hrs/(cs.length*T.length)*100 : 0, max: srt.length ? srt[srt.length-1] : 0,
      p90: srt.length ? srt[Math.min(srt.length-1, Math.ceil(0.9*srt.length) - 1)] : 0};
  });
  // 더 띄워야 하는 지붕만 글자표 (필지 밖으로 꺼내 지시선으로 연결)
  const tags = [];
  rows.forEach(r=>{
    const sc = S.cells.filter(c=>c.b === r.b && c.max > h + 1e-6);
    if (sc.length * S.cell * S.cell < 6) return; // 6㎡ 미만 자투리는 글자 생략 (색칠은 그대로)
    const half = S.cell/2, hl = hull(sc.flatMap(c=>[[c.x-half, c.y-half], [c.x+half, c.y-half], [c.x+half, c.y+half], [c.x-half, c.y+half]]));
    const mx = Math.max(...sc.map(c=>c.max));
    tags.push({ring: hl.map(q=>{ const L = S.toLL(q[0], q[1]); return [L[1], L[0]]; }), text: `그늘 · +${Math.round(up(mx - h)*1000).toLocaleString()}mm`, cls:"shng"});
  });
  S.mgr.set("shade", tags);

  // 범례
  const sw = c=>`<span style="display:inline-block;width:14px;height:14px;border-radius:2px;background:${c};vertical-align:-2px"></span>`;
  $("#shLeg").innerHTML = mode === "now"
    ? `${sw("#3f51b5")} ${hhmm(t.m)}에 그늘 지는 곳 · 색 없음 = 햇빛 · 연한 검정 = 주변 건물 그림자`
    : mode === "need"
    ? `색 없음 = 지금 설치 높이로 그늘 없음 · 색칠 = 더 띄워야 하는 높이 ${sw(col(0))} 조금 → ${sw(col(1))} 최대 ${mm(maxNeed)}`
    : `색 없음 = 하루 종일 햇빛 · 색칠 = 그늘 지는 시간 ${sw(col(0))} 잠깐 → ${sw(col(1))} ${span.toFixed(0)}시간 내내`;

  // 결과
  const tilt = +$("#shTilt").value || 0, len = (+$("#shLen").value || 0) / 1000, rise = len * Math.sin(tilt*rad2);
  const allMax = Math.max(0, ...rows.map(r=>r.max));
  const from = hhmm(T[0].m), to = hhmm(T[T.length-1].m);
  st.innerHTML = `지붕 ${S.roofs.length}조각 · ${S.cells.length.toLocaleString()}칸(칸 크기 ${S.cell}m) · 주변 건물 ${S.blds.length - S.roofs.length}동 계산 · 날짜 ${esc($("#shDate").value)}`;
  let head;
  if (allMax <= 1e-6) head = `<div class="shbig ok">✅ ${from}~${to} 그늘 없음 — 지붕에 바로 설치해도 됩니다.</div>`;
  else if (allMax <= h + 1e-6) head = `<div class="shbig ok">✅ 설치 높이 <b>${mm(h)}</b>면 ${from}~${to} 그늘 없음 <span class="hint">(최소 ${mm(allMax)})</span></div>`;
  else head = `<div class="shbig ng">⚠ 지붕 전체를 그늘 없이 쓰려면 패널 아래 끝을 지붕에서 <b>${mm(allMax)}</b> 이상
      <button type="button" class="xs" onclick="document.getElementById('shH').value='${Math.round(up(allMax)*1000)}';shadeDraw()">이 높이로 보기</button></div>`;
  $("#shRes").innerHTML = head +
    (rise > 0 ? `<div class="hint" style="margin:4px 0 0">경사 ${tilt}°, 세로 ${Math.round(len*1000).toLocaleString()}mm 패널이면 위쪽 끝은 지붕에서 약 ${Math.round((h + rise)*1000).toLocaleString()}mm (지금 설치 높이 ${Math.round(h*1000).toLocaleString()}mm 기준)</div>` : "") +
    "";
}
const rad2 = Math.PI/180;

/* ---------- 전체요약 ---------- */
function kvBlock(it, keys){
  return `<dl class="kv">` + keys.filter(k=>String(it[k] ?? "").trim() !== "").map(k=>{
    const hl = HIGHLIGHT.has(k);
    return `<div${hl?' class="hl"':''}><dt>${hl?'<i>✔</i>':''}${esc(L[k]||k)}</dt><dd>${esc(fmt(k,it[k]))}</dd></div>`;
  }).join("") + `</dl>`;
}
function renderSummary(errs, any){

  }
  /* 0-1. 지번이 여러 개면 지번별 표 + 합계 */
  if (result.lots?.length > 1){

    const row = (name, s, b)=>`<tr${b ? ' style="font-weight:700;background:var(--accent-soft)"' : ""}><td>${esc(name)}</td><td class="num">${s.n || "-"}</td><td class="num">${n2(s.plat)}</td><td class="num">${n2(s.arch)}</td><td class="num">${n2(s.tot)}</td><td class="num">${s.heit > 0 ? s.heit + "m" : "-"}</td></tr>`;
    h += `<div class="bldtitle">지번별 대장 · 면적 · 높이</div><div class="tw" style="margin-bottom:4px"><table class="sumtbl"><thead><tr><th>지번</th><th>동수</th><th>대지면적㎡</th><th>건축면적㎡</th><th>연면적㎡</th><th>최고높이</th></tr></thead><tbody>` +
      result.lots.map(q=>q.sum.err && !q.sum.n ? `<tr><td>${esc(q.label)}</td><td colspan="5" style="color:#c62828;white-space:normal">조회 실패: ${esc(q.sum.err)}</td></tr>` : (q.sum.n || q.sum.plat ? row(q.label, q.sum) : `<tr><td>${esc(q.label)}</td><td colspan="5" class="hint">대장 없음</td></tr>`)).join("") +
      row("합계", result.total, true) + `</tbody></table></div>
      <div class="srcnote">같은 대장이 여러 지번에 걸쳐 나오면 처음 나온 지번에만 셉니다 (관리번호 기준). 대지면적은 총괄표제부 값, 없으면 표제부 값을 쓰며 같은 값은 한 번만 더합니다. 최고높이 합계 칸은 전체 중 가장 높은 값입니다. 층별개요 등 나머지 장은 대표 지번(${esc(result.lots[0].label)}) 기준입니다.</div>`;
  }

      return `<div class="bcard pick" data-bti="${R.getBrTitleInfo.items.indexOf(t)}"><div>${result.lots?.length > 1 ? `<span class="hint">[${esc(t._jibun || "")}]</span> ` : ""}<b>${esc(name)}</b> <span class="hint">${esc([val(t,"mainAtchGbCdNm"), join2(val(t,"mainPurpsCdNm"), val(t,"etcPurps"))].filter(Boolean).join(" · "))}</span></div>

        <div class="hint">${esc([fl, val(t,"archArea") ? "건축면적 " + val(t,"archArea") + "㎡" : "", val(t,"totArea") ? "연면적 " + val(t,"totArea") + "㎡" : "", val(t,"useAprDay") ? "사용승인 " + val(t,"useAprDay") : ""].filter(Boolean).join(" · "))}</div></div>`;
    }).join("");
  }

  /* 3. 가설건축물 요약 */
  const tmp = R.getApTmpBldInfo;
  h += `<div class="bldtitle">가설건축물 허가·신고${qm(MEMO_TMP)}</div><div class="srcnote">출처: 건축HUB 건축인허가정보 · 가설건축물 허가·신고</div>`;
  if (!tmp || tmp.error){
    h += `<div class="msg err" style="margin:0">조회하지 못했습니다${tmp?.error ? `: ${esc(tmp.error)}` : ""}</div>`;
  } else if (!tmp.items.length){
    h += `<div class="empty">내역 없음</div>`;
  } else {
    h += `<div class="msg warn" style="margin:0 0 8px">가설건축물 허가·신고 내역 <b>${tmp.total}건</b> <a href="javascript:void 0" data-go="getApTmpBldInfo">전체 보기 ›</a></div>` +

          <div class="hlrow"><span class="k">✔ 구조</span><span class="v">${esc(join2(val(t,"strctCdNm"), val(t,"etcStrct")) || "-")}</span><span class="k">면적</span><span class="v">${esc(val(t,"totArea","archArea") || "-")}㎡</span></div>
          <div class="hint">존치 ${esc(s || e ? `${s} ~ ${e}` : val(t,"prsvPrd") || "-")} · 허가·신고 ${esc(val(t,"pmsDay","crtnDay") || "-")}</div></div>`;
      }).join("") +
      (tmp.items.length > 10 ? `<p class="hint">상위 10건만 표시 · 나머지는 '가설건축물' 장에서 확인</p>` : "");

  const none = REGS.filter(reg=>!R[reg.op].error && !R[reg.op].items.length && reg.op !== "getApTmpBldInfo").map(reg=>reg.name);

  }
  return any ? mapSlideHtml(h) : `<h3>전체요약</h3>` + h;
}

function renderKv(items){
  const order = Object.keys(L);
  return items.map(it=>{
    const title = [result.lots?.length > 1 ? it._jibun : "", it.bldNm, it.dongNm, it.mainAtchGbCdNm, it.regstrKindCdNm].filter(x=>x && String(x).trim()).join(" · ") || "건축물";
    const fields = Object.keys(it).filter(k=>!SKIP.has(k) && String(it[k] ?? "").trim() !== "");
    fields.sort((a,b)=>(order.indexOf(a)+1||999)-(order.indexOf(b)+1||999));
    return `<div class="bldtitle">${esc(title)}</div>` + kvBlock(it, fields);
  }).join("");
}

/* 빨간 테두리·밑줄·체크로 강조할 항목 */
const HIGHLIGHT = new Set(["strctCdNm","etcStrct","roofCdNm","etcRoof","heit"]);

function renderTbl(reg, items){
  let cols = reg.cols;
  if (reg.auto){ // 지정 컬럼 우선 + 응답에만 있는 나머지 항목도 뒤에 표시
    const extra = [...new Set(items.flatMap(Object.keys))].filter(k=>!SKIP.has(k) && !cols.includes(k) && k!=="mgmPmsrgstPk");
    cols = cols.concat(extra);
  }
  cols = cols.filter(c=>items.some(it=>String(it[c] ?? "").trim() !== ""));
  let foot = "";
  if (cols[cols.length-1] === "area"){
    const tot = items.reduce((s,it)=>s+(Number(it.area)||0),0);
    foot = `<tfoot><tr><th colspan="${cols.length-1}">합계</th><th class="num">${tot.toLocaleString("ko-KR",{maximumFractionDigits:2})}</th></tr></tfoot>`;
  }
  return (reg.filter ? `<div class="filter noprint"><input class="flt" placeholder="동/호 필터 (예: 101동 1203호)" style="width:260px;max-width:100%"></div>` : "") +
    `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${esc(L[c]||c)}</th>`).join("")}</tr></thead><tbody>` +
    items.map(it=>`<tr${reg.filter?"":" data-nf"} data-k="${esc(((it.dongNm||"")+" "+(it.hoNm||"")).replace(/\s+/g," "))}">${cols.map(c=>`<td class="${NUMS.test(c)?"num":""}">${esc(fmt(c,it[c]))}</td>`).join("")}</tr>`).join("") +
    `</tbody>${foot}</table></div>`;
}

function applyFilter(){
  const terms = filterTxt.trim().split(/\s+/).filter(Boolean).map(t=>t.replace(/[동호]$/,""));
  document.querySelectorAll("tr[data-k]:not([data-nf])").forEach(tr=>{
    tr.style.display = terms.every(t=>tr.dataset.k.includes(t)) ? "" : "none";
  });
}

/* 지번주소를 복사하고 세움터를 연다 (현황도는 세움터에서 본인인증 후 발급) */
function openDrawing(btn){
  window.open('https://www.eais.go.kr/','_blank','noopener');
}
/* 발급 사이트 검색용 지번주소 (건물명 제외): 예) 서울특별시 강남구 역삼동 737 */
function plainJibun(){
  const j = result?.juso || {};
  if (j.siNm && j.emdNm && j.lnbrMnnm){
    return [j.siNm, j.sggNm, j.emdNm, j.liNm, (j.mtYn === "1" ? "산" : "") + j.lnbrMnnm + (+j.lnbrSlno ? "-" + j.lnbrSlno : "")]
      .filter(x=>x && String(x).trim()).join(" ");
  }
  return j.jibunAddr || "";
}
function copyAddr(btn){
  const addr = plainJibun();
  const done = ok=>{
    const orig = btn.dataset.orig || (btn.dataset.orig = btn.textContent);
    btn.textContent = ok ? `✓ 복사됨: ${addr}` : "복사 실패 — 직접 선택해 복사하세요";
    btn.classList.toggle("done", ok);
    clearTimeout(btn._t); btn._t = setTimeout(()=>{ btn.textContent = orig; btn.classList.remove("done"); }, 2500);
  };
  const fallback = ()=>{
    const ta = document.createElement("textarea"); ta.value = addr; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
    ta.remove(); done(ok);
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(addr).then(()=>done(true), fallback);
  else fallback();
}

/* ---------- 4. 내보내기 ---------- */
function save(name, blob){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function baseName(){ return "건축물대장_" + (result.juso.bdNm || result.juso.roadAddr).replace(/[\\/:*?"<>|\s]+/g,"_"); }
function dlJson(){ save(baseName()+".json", new Blob([JSON.stringify(result,null,2)],{type:"application/json"})); }
function dlCsv(){
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const lines = [];
  for (const reg of REGS){
    const items = result.regs[reg.op].items;
    if (!items.length) continue;
    const keys = [...new Set(items.flatMap(Object.keys))].filter(k=>!SKIP.has(k));
    lines.push(q("["+reg.name+"]"));
    lines.push(keys.map(k=>q(L[k]||k)).join(","));
    items.forEach(it=>lines.push(keys.map(k=>q(fmt(k,it[k]))).join(",")));
    lines.push("");
  }
  save(baseName()+".csv", new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv"}));
}
